name: Mirror to Gitee

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitee-mirror
  cancel-in-progress: true

jobs:
  mirror:
    name: Mirror Git refs to Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Check Gitee credentials
        id: credentials
        shell: bash
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if [[ -z "${GITEE_USERNAME:-}" || -z "${GITEE_TOKEN:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Gitee mirror skipped::Add GITEE_USERNAME and GITEE_TOKEN repository secrets to enable mirroring."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push refs to Gitee
        if: steps.credentials.outputs.configured == 'true'
        shell: bash
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          credential_file="${RUNNER_TEMP}/gitee-credentials"
          trap 'rm -f "${credential_file}"' EXIT
          git config --global credential.helper "store --file=${credential_file}"
          printf 'protocol=https\nhost=gitee.com\nusername=%s\npassword=%s\n\n' \
            "$GITEE_USERNAME" "$GITEE_TOKEN" | git credential approve

          git fetch origin "+refs/heads/*:refs/remotes/origin/*" --tags
          git remote add gitee "https://gitee.com/MagicCube99/browser-harbor.git"
          git ls-remote gitee > /dev/null
          git push --force gitee HEAD:refs/heads/main
          git push --force --tags gitee

          if metadata_sha=$(git rev-parse --verify refs/remotes/origin/metadata-live 2>/dev/null); then
            remote_sha=$(git ls-remote gitee refs/heads/metadata-live | awk '{print $1}')
            if [[ -n "${remote_sha}" ]]; then
              git push \
                --force-with-lease="refs/heads/metadata-live:${remote_sha}" \
                gitee \
                "${metadata_sha}:refs/heads/metadata-live"
            else
              git push gitee "${metadata_sha}:refs/heads/metadata-live"
            fi

            for file in trusted-metadata.json trusted-metadata.sig; do
              expected=$(git show "${metadata_sha}:assets/${file}" | sha256sum | awk '{print $1}')
              downloaded="${RUNNER_TEMP}/gitee-${file}"
              curl --silent --show-error --fail --location \
                --retry 3 --retry-delay 2 --retry-all-errors --max-time 30 \
                "https://gitee.com/MagicCube99/browser-harbor/raw/${metadata_sha}/assets/${file}?verify=${GITHUB_RUN_ID}" \
                --output "${downloaded}"
              actual=$(sha256sum "${downloaded}" | awk '{print $1}')
              if [[ "${actual}" != "${expected}" ]]; then
                echo "Gitee Raw checksum mismatch for ${file}" >&2
                exit 1
              fi
            done
          else
            echo "::notice title=Metadata mirror skipped::GitHub metadata-live does not exist yet."
          fi

          curl --silent --show-error --fail \
            --request PATCH \
            --form-string "access_token=${GITEE_TOKEN}" \
            --form-string "name=browser-harbor" \
            --form-string "description=Browser Harbor - portable browser downloader and manager" \
            --form-string "homepage=https://gitee.com/MagicCube99/browser-harbor" \
            --form-string "default_branch=main" \
            --form-string "private=false" \
            --form-string "has_issues=true" \
            --form-string "has_wiki=false" \
            --form-string "pull_requests_enabled=false" \
            --form-string "online_edit_enabled=false" \
            "https://gitee.com/api/v5/repos/MagicCube99/browser-harbor" \
            > /dev/null
