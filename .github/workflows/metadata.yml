name: Metadata

on:
  schedule:
    - cron: "17,47 * * * *"
    - cron: "7 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-metadata
  cancel-in-progress: false

jobs:
  probe:
    name: Probe official release versions
    runs-on: windows-2025
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.probe.outputs.changed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-metadata-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-metadata-${{ runner.os }}-

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Load current signed metadata
        shell: pwsh
        run: |
          git fetch origin metadata-live
          if ($LASTEXITCODE -eq 0) {
            git restore --source=FETCH_HEAD -- assets/trusted-metadata.json assets/trusted-metadata.sig
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            Write-Host "Loaded the current metadata-live baseline."
          } else {
            Write-Host "metadata-live does not exist yet; using the embedded baseline."
          }
          exit 0

      - name: Probe official versions
        id: probe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $output = cargo run --quiet --bin metadata -- probe `
            --baseline .\assets\trusted-metadata.json `
            --signature .\assets\trusted-metadata.sig `
            --public-key .\assets\metadata-public-key.hex
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $result = @($output) |
            Where-Object { $_ -match '^changed=(true|false)$' } |
            Select-Object -Last 1
          if (-not $result) {
            throw "Metadata probe did not report a changed status."
          }
          $result | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

  refresh:
    name: Refresh signed browser metadata
    needs: probe
    if: >-
      needs.probe.outputs.changed == 'true' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '7 18 * * *'
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Cache Cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-metadata-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-metadata-${{ runner.os }}-

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1

      - name: Load current signed metadata
        shell: pwsh
        run: |
          git fetch origin metadata-live
          if ($LASTEXITCODE -eq 0) {
            git restore --source=FETCH_HEAD -- assets/trusted-metadata.json assets/trusted-metadata.sig
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            Write-Host "Loaded the current metadata-live baseline."
          } else {
            Write-Host "metadata-live does not exist yet; using the embedded baseline."
          }
          exit 0

      - name: Refresh official metadata
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cargo run --quiet --bin metadata -- refresh `
            --baseline .\assets\trusted-metadata.json `
            --signature .\assets\trusted-metadata.sig `
            --public-key .\assets\metadata-public-key.hex `
            --output .\assets\trusted-metadata.json

      - name: Sign metadata
        shell: pwsh
        env:
          BROWSER_HARBOR_METADATA_SIGNING_KEY: ${{ secrets.BROWSER_HARBOR_METADATA_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BROWSER_HARBOR_METADATA_SIGNING_KEY)) {
            throw "The metadata signing key secret is not configured."
          }
          cargo run --quiet --bin metadata -- sign-env `
            --manifest .\assets\trusted-metadata.json `
            --variable BROWSER_HARBOR_METADATA_SIGNING_KEY `
            --signature .\assets\trusted-metadata.sig

      - name: Verify signed metadata
        shell: pwsh
        run: |
          cargo run --quiet --bin metadata -- verify `
            --manifest .\assets\trusted-metadata.json `
            --signature .\assets\trusted-metadata.sig `
            --public-key .\assets\metadata-public-key.hex

      - name: Publish signed metadata
        shell: pwsh
        run: |
          git add assets/trusted-metadata.json assets/trusted-metadata.sig
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Signed metadata is unchanged."
            exit 0
          }
          if ($LASTEXITCODE -ne 1) {
            exit $LASTEXITCODE
          }

          $metadata = Join-Path $env:RUNNER_TEMP "trusted-metadata.json"
          $signature = Join-Path $env:RUNNER_TEMP "trusted-metadata.sig"
          Copy-Item -LiteralPath assets/trusted-metadata.json -Destination $metadata
          Copy-Item -LiteralPath assets/trusted-metadata.sig -Destination $signature
          git reset --hard HEAD

          git fetch origin metadata-live
          if ($LASTEXITCODE -eq 0) {
            git switch -C metadata-live FETCH_HEAD
          } else {
            git switch --orphan metadata-live
          }

          New-Item -ItemType Directory -Force -Path assets | Out-Null
          Copy-Item -LiteralPath $metadata -Destination assets/trusted-metadata.json -Force
          Copy-Item -LiteralPath $signature -Destination assets/trusted-metadata.sig -Force
          git add assets/trusted-metadata.json assets/trusted-metadata.sig
          git config user.name "Browser Harbor Metadata Bot"
          git config user.email "metadata-bot@users.noreply.github.com"
          git commit -m "chore(metadata): refresh signed browser releases"
          git push origin HEAD:refs/heads/metadata-live
